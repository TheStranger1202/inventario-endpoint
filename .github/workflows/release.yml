name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Binary & Create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cliente de PostgreSQL en Windows (libpq)
        run: |
          choco install postgresql15 --force --no-progress
          echo "C:\Program Files\PostgreSQL\15\bin" >> $env:GITHUB_PATH

      - name: Instalar dependencias de Nimble
        run: |
          nimble install -y nigui db_connector

      - name: Compilar binario de Windows (Release Standalone con credenciales inyectadas)
        run: |
          nim c -d:danger --opt:speed --passL:-mwindows `
            -d:compiledHost="${{ secrets.DB_HOST }}" `
            -d:compiledPort="${{ secrets.DB_PORT }}" `
            -d:compiledUser="${{ secrets.DB_USER }}" `
            -d:compiledPass="${{ secrets.DB_PASSWORD }}" `
            -d:compiledName="${{ secrets.DB_NAME }}" `
            -o:inventario_endpoint.exe src/inventario_endpoint.nim

      - name: Empaquetar ejecutable y DLLs necesarias
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item inventario_endpoint.exe -Destination dist\
          Copy-Item "C:\Program Files\PostgreSQL\15\bin\libpq.dll" -Destination dist\
          Copy-Item "C:\Program Files\PostgreSQL\15\bin\libcrypto-3-x64.dll" -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item "C:\Program Files\PostgreSQL\15\bin\libssl-3-x64.dll" -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item "C:\Program Files\PostgreSQL\15\bin\libintl-8.dll" -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item "C:\Program Files\PostgreSQL\15\bin\libiconv-2.dll" -Destination dist\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath inventario_endpoint_windows.zip

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: inventario_endpoint_windows.zip
          name: "Release ${{ github.ref_name }} — Cyber-Collector"
          generate_release_notes: true
          body: |
            ## 🚀 Versión ${{ github.ref_name }} - Auto-Registro de Inventario de Endpoints
            
            ### ✨ Características del Release:
            - **Consulta Atómica:** Extracción de hardware, red y seguridad vía clases CIM/WMI de Windows.
            - **Persistencia Híbrida TCP:** Registro directo en PostgreSQL corporativo con respaldo local JSON en caso de fallos de red.
            - **Interfaz Gráfica Cyberpunk/Dracula:** Construida en Nim puro (`NiGui`).
            - **Portabilidad Standalone:** Credenciales compiladas internamente de forma segura e incluye DLLs de PostgreSQL para ejecución directa sin requerir `.env` externo.
            
            ### 📦 Instrucciones de Ejecución:
            1. Descarga y descomprime `inventario_endpoint_windows.zip`.
            2. Ejecuta `inventario_endpoint.exe` en cualquier endpoint con Windows 10 u 11.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
