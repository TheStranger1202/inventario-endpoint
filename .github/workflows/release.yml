name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Binary & Create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar libpq y DLLs de PostgreSQL (Rápido - Sin Chocolatey)
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-pkgs/releases/download/v1.0/dummy" -OutFile "dummy.txt" -ErrorAction SilentlyContinue
          # Descargamos directamente libpq.dll y sus librerías livianas
          mkdir C:\pq_bin
          curl.exe -sSL -o C:\pq_bin\libpq.dll https://raw.githubusercontent.com/postgresql/postgres/master/src/interfaces/libpq/win32.def -ErrorAction SilentlyContinue

      - name: Instalar dependencias de Nimble
        run: |
          nimble install -y nigui db_connector

      - name: Compilar binario de Windows (Release con salida de consola para Debug)
        run: |
          nim c -d:danger --opt:speed `
            -d:compiledHost="${{ secrets.DB_HOST }}" `
            -d:compiledPort="${{ secrets.DB_PORT }}" `
            -d:compiledUser="${{ secrets.DB_USER }}" `
            -d:compiledPass="${{ secrets.DB_PASSWORD }}" `
            -d:compiledName="${{ secrets.DB_NAME }}" `
            -o:inventario_endpoint.exe src/inventario_endpoint.nim

      - name: Empaquetar ejecutable y DLLs de MinGW/Runtime
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item inventario_endpoint.exe -Destination dist\
          
          # Copiar DLLs del compilador GCC/MinGW
          $gccBin = Split-Path (Get-Command gcc).Source
          Copy-Item "$gccBin\libwinpthread-1.dll" -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item "$gccBin\libgcc_s_seh-1.dll" -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item "$gccBin\libstdc++-6.dll" -Destination dist\ -ErrorAction SilentlyContinue

          # Si existen DLLs en el sistema, adjuntarlas
          Get-ChildItem -Path "C:\Program Files\PostgreSQL" -Filter "libpq.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 | Copy-Item -Destination dist\ -ErrorAction SilentlyContinue

          Compress-Archive -Path dist\* -DestinationPath inventario_endpoint_windows.zip

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: inventario_endpoint_windows.zip
          name: "Release ${{ github.ref_name }} — Cyber-Collector"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
